---
# ansible-homelab/inventory/hosts.yml
# NOTE: The Raspberry Pi running HAOS is intentionally excluded from this inventory.

all:
  children:
    # Both machines get node_exporter + cAdvisor
    monitored:
      hosts:
        desktop-tower:
          ansible_host: 192.168.4.10
          ansible_user: lilfolr
          ansible_password: "{{ vault_tower_password }}"
        mini-server:
          ansible_user: lilfolr
          ansible_host: 192.168.4.239

    # Hosts that run the monitoring stack (Prometheus + Grafana)
    monitoring_servers:
      hosts:
        mini-server:

    # Hosts that run Portainer
    portainer_hosts:
      hosts:
        mini-server:

    # Hosts running Portainer Agent
    portainer_agents:
      hosts:
        desktop-tower:

    # Hosts running Frigate + InfluxDB
    nvr:
      hosts:
        desktop-tower:

    # Hosts running Immich
    photo_management:
      hosts:
        mini-server:
