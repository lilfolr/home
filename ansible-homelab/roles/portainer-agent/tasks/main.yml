---
# roles/portainer-agent/tasks/main.yml
# Deploys Portainer Agent as a Docker container for remote management.

- name: Deploy Portainer Agent container
  community.docker.docker_container:
    name: portainer_agent
    image: "portainer/agent:{{ portainer_agent_version }}"
    state: started
    restart_policy: unless-stopped
    env:
      AGENT_CLUSTER_ADDR: "0.0.0.0"
    ports:
      - "{{ portainer_agent_port }}:9001"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/var/lib/docker/volumes:/var/lib/docker/volumes"

